# Runs when a release is published (not when the draft is created). It rewrites
# version and checksums in Casks/issuemon.rb of fundament-agency/homebrew-tap.
#
# The push uses a write-enabled deploy key on fundament-agency/homebrew-tap; its
# private half is stored as the repository secret TAP_DEPLOY_KEY here. The
# default GITHUB_TOKEN cannot push to another repository.
name: Update Homebrew cask

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: fundament-agency/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Rewrite version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          gh release download "$TAG" -R "${{ github.repository }}" -p "issuemon-$V-arm64.tar.xz" -p "issuemon-$V-x64.tar.xz"
          ARM=$(sha256sum "issuemon-$V-arm64.tar.xz" | cut -d' ' -f1)
          X64=$(sha256sum "issuemon-$V-x64.tar.xz" | cut -d' ' -f1)
          # The patterns match the exact spacing in the tap's Casks/issuemon.rb:
          # `arm:   "` has three spaces after the colon, `intel: "` has one.
          # The last one points a url that still names the .zip (0.1.1 and earlier) at the .tar.xz.
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$V\"/" \
            -e "s/(arm:   \")[0-9a-f]+(\")/\1$ARM\2/" \
            -e "s/(intel: \")[0-9a-f]+(\")/\1$X64\2/" \
            -e 's/(-#\{arch\})\.zip"/\1.tar.xz"/' \
            Casks/issuemon.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run finds the cask already current: nothing to commit.
          git diff --quiet || { git commit -am "issuemon $V" && git push; }
