# Release flow: push a tag `vX.Y.Z` that matches the version in package.json.
# This workflow runs the unit tests, builds the macOS assets (arm64 and x64, a dmg
# and a tar.xz for Homebrew), verifies the code signatures and the archives, runs
# the e2e tests against the built arm64 app and only then uploads the assets to a
# DRAFT GitHub release. Nothing is public yet.
# Review the draft, then publish it by hand on GitHub. Publishing triggers
# update-cask.yml, which updates the Homebrew cask.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      - run: npm test

      # Nothing is uploaded before the signatures check out, so a broken build never leaves assets on a release.
      - name: Build
        run: npx electron-builder --mac --publish never

      - name: Verify the code signatures
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/IssueMon.app
          codesign --verify --deep --strict --verbose=2 dist/mac/IssueMon.app

      # Each tar.xz unpacked the way Homebrew does it: the app must be signed and dated (an archive without folder
      # dates, like electron-builder's own tar.xz, unpacks as 1970). Each dmg must be LZMA-compressed.
      - name: Verify the archives
        run: |
          for f in dist/*.tar.xz; do
            d=$(mktemp -d)
            tar --extract --no-same-owner --file "$f" --directory "$d"
            codesign --verify --deep --strict "$d/IssueMon.app"
            [ "$(stat -f %m "$d/IssueMon.app")" -gt 0 ] || { echo "$f: IssueMon.app has no date" >&2; exit 1; }
          done
          for f in dist/*.dmg; do
            hdiutil imageinfo "$f" | grep -q '^Format: ULMO$' || { echo "$f is not LZMA-compressed" >&2; exit 1; }
          done

      # The e2e tests drive the Apple silicon app that is about to be uploaded. A few sub-tests are known to be flaky;
      # one retry is allowed.
      - run: npm run test:e2e || npm run test:e2e
        env:
          ISSUEMON_APP: dist/mac-arm64/IssueMon.app/Contents/MacOS/IssueMon

      - name: Create the draft release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md" \
            dist/*.dmg dist/*.tar.xz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the files even if a step above failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issuemon-release
          path: |
            dist/*.dmg
            dist/*.tar.xz
