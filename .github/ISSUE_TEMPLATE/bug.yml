name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IssueMon version
      description: Shown in the About window.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - DMG download
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: jira
    attributes:
      label: Which Jira do you use?
      options:
        - Jira Cloud
        - Jira Server or Data Center
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Hide anything private.
